[tox]
isolated_build = true
skip_missing_interpreters = true
toxworkdir = ./.tox
requires =
    tox-uv>=1.10
env_list =
    py313
    ruff
    ty

[testenv]
description = Run pytest on Python 3.13
extras = visualize
deps =
    pytest>=8,<10
commands =
    python -m pytest -q {posargs}

[testenv:ruff]
description = Run Ruff and repository style checks
skip_install = true
deps =
    ruff>=0.9,<1
commands =
    ruff check --output-format=github .
    python scripts/check_polars_style.py src tests

[testenv:ruff-format]
description = Apply Ruff formatter to the codebase
skip_install = true
deps =
    ruff>=0.9,<1
commands =
    ruff format .

[testenv:ty]
description = Run ty static type checks
extras = visualize
deps =
    ty==0.0.86
    pyarrow-stubs
commands =
    ty --version
    ty check {posargs}
