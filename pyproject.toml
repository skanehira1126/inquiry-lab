[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "inquiry-lab"
dynamic = ["version"]
description = "Execution-independent analysis workspace templates"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["pyarrow>=19"]

[project.optional-dependencies]
visualize = ["matplotlib>=3.8", "numpy>=1.26", "polars>=1", "scikit-learn>=1.4"]

[project.scripts]
inquiry-lab = "inquiry_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "inquiry-lab[visualize]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
